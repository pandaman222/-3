<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>だいたい貯金</title>
<style>
/* ===== 1. デザイントークン ===== */
:root{
/* 余白 4pt グリッド */--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
/* 角丸 */--r1:8px;--r2:12px;--r3:999px;
/* 文字 */--f-cap:12px;--f-sub:13px;--f-body:15px;--f-ttl:17px;--f-h:24px;--f-num:44px;
--font:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
/* 色（ライト） */--bg:#eef0f3;--sf:#fff;--fill:#f2f4f6;--ln:#e6e9ed;--tx:#111418;--sub:#7a828b;--bad:#e5484d;
/* アクセント（着せ替えで上書き） */--ac:#06c755;--act:#04a046;--on:#fff;--ac2:color-mix(in srgb,var(--ac) 14%,var(--sf));
--ease:cubic-bezier(.2,.8,.2,1);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c0e;--sf:#17191c;--fill:#23262a;--ln:#2a2d32;--tx:#f2f4f6;--sub:#8b939c;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0c0e;--sf:#17191c;--fill:#23262a;--ln:#2a2d32;--tx:#f2f4f6;--sub:#8b939c;--bad:#ff6b6b;color-scheme:dark}
/* ===== 2. 基本 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--f-body)/1.55 var(--font);max-width:520px;margin-inline:auto;padding-bottom:84px;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:disabled{opacity:.35;cursor:default}
input[type=search]{-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
svg{display:block;flex:none}
.sub{color:var(--sub);font-size:var(--f-sub)}.bad{color:var(--bad)}
/* ===== 3. レイアウト（カードではなく全幅のセクション） ===== */
.hd{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 var(--s4);background:var(--sf)}
.hd h1{font-size:var(--f-h);font-weight:700;margin:0;letter-spacing:-.01em}
.sec{background:var(--sf);padding:var(--s4);margin-bottom:var(--s2)}
.sec.flat{padding-inline:0}
.st{font-size:var(--f-sub);font-weight:600;color:var(--sub);margin:0 0 var(--s3)}
.flex{display:flex;gap:var(--s2);align-items:center}
.between{justify-content:space-between}
/* ===== 4. 共通コンポーネント ===== */
.ib{width:44px;height:44px;border-radius:var(--r3);display:grid;place-items:center;transition:background .15s}
.ib:active{background:var(--fill)}
.btn{min-height:48px;padding:0 var(--s4);border-radius:var(--r2);background:var(--fill);font-weight:600;transition:transform .12s var(--ease),background .15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);color:var(--on)}
.btn.d{color:var(--bad)}
.btn.s{min-height:36px;padding:0 var(--s3);font-size:var(--f-sub);border-radius:var(--r1)}
.fld,input,select,textarea{width:100%;min-height:48px;padding:0 var(--s3);border:1px solid transparent;border-radius:var(--r2);background:var(--fill);font-size:16px}
textarea{padding:var(--s3)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:0}
.f{display:block;font-size:var(--f-sub);color:var(--sub);margin-bottom:var(--s3)}
.f input,.f select{margin-top:var(--s1);color:var(--tx)}
.chips{display:flex;gap:var(--s2);overflow-x:auto;margin:0 calc(-1*var(--s4));padding:0 var(--s4) 2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;min-height:36px;padding:0 var(--s4);border-radius:var(--r3);background:var(--fill);font-size:var(--f-sub);font-weight:600;transition:background .15s,color .15s,transform .12s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ac);color:var(--on)}
.seg{display:flex;background:var(--fill);border-radius:var(--r2);padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:calc(var(--r2) - 3px);font-size:var(--f-sub);font-weight:600;color:var(--sub);transition:background .2s,color .2s}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.li{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);width:100%;text-align:left;min-height:60px;padding:var(--s2) var(--s4);position:relative;transition:background .12s}
.li:active{background:var(--fill)}
.li+.li::before{content:"";position:absolute;top:0;left:var(--s4);right:0;height:1px;background:var(--ln)}
.li .t{min-width:0}.li b{font-weight:600;white-space:nowrap}
.li .r{display:flex;align-items:center;gap:var(--s1);color:var(--sub)}.li .r b{color:var(--tx)}
.empty{padding:var(--s5) var(--s4);text-align:center}
.meter{position:relative;height:6px;border-radius:3px;background:var(--fill);margin:var(--s4) 0 var(--s3)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ac);transition:width .5s var(--ease)}
.meter.ov i{background:var(--bad)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.35}
.gl{display:block;width:100%;text-align:left;padding:var(--s4);position:relative}
.gl+.gl::before{content:"";position:absolute;top:0;left:var(--s4);right:0;height:1px;background:var(--ln)}
.gi{font-size:26px;width:44px;height:44px;border-radius:50%;background:var(--ac2);display:grid;place-items:center;flex:none}
.gl .meter{margin:var(--s3) 0 0}
.ok{color:var(--act);font-weight:700}
.note{background:var(--fill);border-radius:var(--r2);padding:var(--s3);font-size:var(--f-cap);color:var(--sub);line-height:1.6}
.cell.rec .dn{box-shadow:inset 0 0 0 2px var(--ac)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s var(--ease)}
.num{font-size:var(--f-num);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.amt{min-height:56px;border-radius:var(--r2);background:var(--fill);font-size:18px;font-weight:600;transition:transform .12s var(--ease),background .15s}
.amt:active{transform:scale(.95);background:var(--ac2)}
.mbar{display:flex;justify-content:space-between;align-items:center;background:var(--sf);padding:0 var(--s2);border-top:1px solid var(--ln);margin-bottom:var(--s2)}
.mbar b{font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:var(--s1);text-align:center}
.cal>span{font-size:var(--f-cap);color:var(--sub);padding-bottom:var(--s1)}
.cell{height:54px;border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;font-size:14px;transition:background .15s}
.cell .dn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.cell.t .dn{background:var(--ac);color:var(--on);font-weight:700}
.cell.sel{background:var(--ac2)}
.cell small{font-size:10px;color:var(--sub);line-height:1.2}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--sub);text-align:center;line-height:1.3}
.bars i{display:block;width:100%;max-width:28px;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:2px;margin:2px 0;transition:height .4s var(--ease)}
.bars .o i{opacity:.3}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:var(--s4)}
.stack i{display:block;height:100%}
.thin{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:6px}
.thin i{display:block;height:100%;background:var(--ac)}.thin.over i{background:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:var(--s2)}
.sw{display:flex;gap:var(--s3);overflow-x:auto;margin:0 calc(-1*var(--s4));padding:2px var(--s4);scrollbar-width:none}
.sw button{flex:none;width:64px;text-align:center;font-size:var(--f-cap);color:var(--sub)}
.sw i{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 6px;border-radius:50%;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .15s var(--ease)}
.sw button:active i{transform:scale(.92)}
.sw .on i{box-shadow:0 0 0 2px var(--sf),0 0 0 4px currentColor}.sw .on{color:var(--tx);font-weight:600}
/* ===== 5. タブ・シート・トースト ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--sub);transition:color .2s}
.tabs button.on{color:var(--tx)}.tabs button.on svg{color:var(--act)}
.tabs button:active svg{transform:scale(.9)}.tabs svg{transition:transform .15s var(--ease)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
#sh.open{opacity:1;pointer-events:auto}
#sh>div{width:100%;max-width:520px;background:var(--sf);border-radius:20px 20px 0 0;padding:var(--s5) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom,0px));transform:translateY(32px);transition:transform .3s var(--ease);max-height:90vh;overflow:auto}
#sh.open>div{transform:none}
#sh h2{font-size:var(--f-ttl);margin:0 0 var(--s4)}
#toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:#2b2e33;color:#fff;padding:var(--s3) var(--s4);border-radius:var(--r2);font-size:14px;opacity:0;transition:opacity .2s,transform .25s var(--ease);pointer-events:none;display:flex;gap:var(--s4);align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#7ee2a8;font-weight:700;white-space:nowrap;padding:var(--s1) 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sh"><div></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
'use strict';
/* ===== データ層（保存キー daitai-v1・形式は従来どおり） ===== */
const TEST=/[?&]test=on(&|$)/.test(location.search)||location.hash==='#test';
const DEV=TEST||/[?&]dev=on(&|$)/.test(location.search)||location.hash==='#dev';
const MEM={},LS={getItem:k=>TEST?(k in MEM?MEM[k]:null):localStorage.getItem(k),setItem:(k,v)=>{if(TEST)MEM[k]=String(v);else localStorage.setItem(k,v)}};  // テスト中は本物の保存領域に一切触れない
const K='daitai-v1',PAL=['var(--ac)','color-mix(in srgb,var(--ac) 65%,var(--sf))','color-mix(in srgb,var(--ac) 38%,var(--sf))','#f5a524','#8b95a1','#c7ccd1'];
const def=()=>({v:1,cats:[{id:'c1',name:'食費',budget:30000},{id:'c2',name:'ランチ',budget:15000},{id:'c3',name:'娯楽',budget:10000},{id:'c4',name:'交通費',budget:8000}],mb:{},items:[],goals:[],allocs:[]});
let NEWU=false;  // 保存データが無い＝新規ユーザー
const newUser=()=>({v:1,cats:[],mb:{'2000-01':0},items:[],goals:[],allocs:[]});  // 予算は未設定(0)
const amaxOk=v=>Number.isInteger(v)&&v>=100&&v<=1e7;
function load(){let raw=null;try{raw=LS.getItem(K)}catch(e){}
  if(raw){try{const o=JSON.parse(raw);if(o&&Array.isArray(o.cats)&&Array.isArray(o.items)){o.mb=o.mb&&typeof o.mb==='object'?o.mb:{};o.goals=Array.isArray(o.goals)?o.goals:[];o.allocs=Array.isArray(o.allocs)?o.allocs:[];if(!amaxOk(o.amax))delete o.amax;return o}}catch(e){}
    try{LS.setItem(K+'-corrupt',raw)}catch(e){}}  // 読めないデータは上書き前に退避
  if(raw==null){NEWU=true;return newUser()}
  return def()}
let D=load();
const save=()=>{try{LS.setItem(K,JSON.stringify(D))}catch(e){toast('保存できませんでした。端末の空き容量を確認してください')}};
/* ===== ユーティリティ ===== */
const $=s=>document.querySelector(s),g=id=>document.getElementById(id);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const yc=v=>v>=10000?(v/1e4).toFixed(v%1e4?1:0)+'万':v.toLocaleString('ja-JP');
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mk=d=>ds(d).slice(0,7);
const md=s=>s.slice(5).replace('-','/');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const okDate=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00');return !isNaN(d)&&ds(d)===s};
const W=['日','月','火','水','木','金','土'];
const sqDef=()=>({q:'',cat:'',p:'all',from:'',to:'',min:'',max:''});
let tab='home',vm=new Date(),sel=D.cats[0]&&D.cats[0].id,selDay=null,range='week',lastId=null,H=[],tt,sq=sqDef();
vm.setDate(1);
const budgetOf=m=>{if(D.mb[m]!=null)return D.mb[m];const ks=Object.keys(D.mb).filter(k=>k<=m).sort();return ks.length?D.mb[ks[ks.length-1]]:100000};
const mi=m=>D.items.filter(i=>i.date.startsWith(m));
const sum=a=>a.reduce((s,i)=>s+i.amt,0);
const cname=id=>{const c=D.cats.find(c=>c.id===id);return c?esc(c.name):'(削除済み)'};
const DEFA=[500,750,1000,1500,2000,3000,5000,10000];
/* カテゴリー候補（ここを書き換えればそのまま候補が変わる） */
const CAND=['日用品','交際費','衣服','美容','医療','趣味','光熱費','通信費','家賃','サブスク','教育','ペット','カフェ','コンビニ','飲み会','旅行','貯金'];
function candHtml(q,pick){const have=new Set(D.cats.map(c=>c.name)),t=String(q||'').normalize('NFKC').trim().toLowerCase();
  const l=CAND.filter(n=>!have.has(n)&&(!t||n.toLowerCase().includes(t)||n===pick));
  return l.map(n=>`<button class="chip ${n===pick?'on':''}" data-a="pc" data-n="${esc(n)}">${esc(n)}</button>`).join('')||'<span class="sub">候補はありません。自由に入力してください</span>'}
/* 最近使ったカテゴリー（新しい記録順） */
function recentIds(n){const out=[];
  const its=D.items.map((x,k)=>[x,k]).sort((a,c)=>a[0].date<c[0].date?1:a[0].date>c[0].date?-1:c[1]-a[1]);
  for(const a of its){const id=a[0].cat;if(!out.includes(id)&&D.cats.some(c=>c.id===id)){out.push(id);if(out.length>=n)break}}
  return out}
/* 金額ボタンの自動生成：最大値→使いやすい金額の候補→8個以内に間引く。最大値は必ず含む */
function genAmts(max){
  max=Math.round(max);if(!(max>=1))return[];
  if(max<100)return[max];
  const lo=Math.max(100,max/100),a=[];
  for(let p=100;p<=max;p*=10)for(const k of(p===100?[1,2,3,5]:[1,1.5,2,3,5])){const v=p*k;if(v>=lo&&v<=max&&v<max*0.9)a.push(v)}  // 最大値に近すぎる候補は省く
  a.push(max);
  while(a.length>8){let bi=1,bg=Infinity;for(let i=1;i<a.length-1;i++){const r=a[i+1]/a[i-1];if(r<bg){bg=r;bi=i}}a.splice(bi,1)}  // 間隔が詰まった所から1つずつ減らす
  return a}
const amtsOf=c=>c&&Array.isArray(c.amts)?c.amts:(amaxOk(D.amax)?genAmts(D.amax):DEFA);  // 個別に調整したカテゴリーはそれを優先
/* ===== 目標（振り分け）：履歴 allocs から進捗を毎回計算するので二重計上が起きない ===== */
const ICONS=['✈️','🎮','🛍️','🎁','🏠','🚗','📱','🍰','🎓','💰'];
const gsum=id=>D.allocs.filter(a=>a.goal===id).reduce((s,a)=>s+a.amt,0);
const asum=m=>D.allocs.filter(a=>a.month===m).reduce((s,a)=>s+a.amt,0);
const avail=m=>Math.max(0,budgetOf(m)-sum(mi(m))-asum(m));
const recDays=m=>new Set(mi(m).map(i=>i.date)).size;
let gico=ICONS[0];
const openSh=h=>{$('#sh>div').innerHTML=h;$('#sh').classList.add('open')};
const arow=a=>{const x=D.goals.find(q=>q.id===a.goal);return `<button class="li" data-a="aedit" data-i="${esc(a.id)}"><span class="t"><b>${x?x.icon+' '+esc(x.name):'(削除済み)'}</b><br><span class="sub">${md(a.date)}　${a.month.replace('-','/')}の残額から</span></span><span class="r"><b>${yen(a.amt)}</b>${ic('r',18)}</span></button>`};
function openGoal(id){const x=D.goals.find(q=>q.id===id);if(!x)return;const m=mk(vm),av=avail(m),s=gsum(id),p=Math.min(100,s/x.target*100),done=s>=x.target,qi=esc(id);
  const h=D.allocs.filter(a=>a.goal===id).sort((a,b)=>a.date<b.date?1:-1).map(arow).join('')||'<div class="sub" style="padding:var(--s3) var(--s4)">まだ振り分けていません</div>';
  openSh(`<div class="flex"><span class="gi">${x.icon}</span><h2 style="margin:0;flex:1">${esc(x.name)}</h2><button class="btn s" data-a="gedit" data-i="${qi}">編集</button></div>
  <div class="meter"><i style="width:${p}%"></i></div><div class="flex between sub"><span>${yen(s)} / ${yen(x.target)}</span><span>${done?'<span class="ok">達成！</span>':'あと '+yen(x.target-s)}</span></div>
  <h2 class="st" style="margin:var(--s5) 0 var(--s2)">${vm.getMonth()+1}月の残額 ${yen(av)} から振り分ける</h2>
  <div class="chips wrap" style="margin-bottom:var(--s3)">${[1000,3000,5000].map(v=>`<button class="chip" data-a="gfill" data-v="${v}">${v.toLocaleString()}</button>`).join('')}<button class="chip" data-a="gfill" data-v="${av}">全額</button></div>
  <div class="flex"><input id="ga" type="number" inputmode="numeric" min="1" placeholder="金額（円）"><button class="btn p" style="flex:none" data-a="galloc" data-i="${qi}" ${av?'':'disabled'}>振り分ける</button></div>
  <h2 class="st" style="margin:var(--s5) 0 0">この目標の履歴</h2><div style="margin:0 calc(-1*var(--s4))">${h}</div>
  <button class="btn" style="width:100%;margin-top:var(--s4)" data-a="close">閉じる</button>`)}
function openAlloc(id){const a=D.allocs.find(q=>q.id===id);if(!a)return;const x=D.goals.find(q=>q.id===a.goal),mx=avail(a.month)+a.amt,qi=esc(id);
  openSh(`<h2>振り分けを修正</h2><div class="sub" style="margin-bottom:var(--s3)">${x?esc(x.name):''}　${a.month.replace('-','/')}の残額から（上限 ${yen(mx)}）</div><label class="f">金額（円）<input id="al-a" type="number" inputmode="numeric" min="1" value="${a.amt}"></label>
  <div class="flex"><button class="btn d" data-a="adel" data-i="${qi}">取り消す</button><button class="btn" style="flex:1" data-a="close">キャンセル</button><button class="btn p" style="flex:1" data-a="asave" data-i="${qi}">保存</button></div>`)}
function gform(id){const x=id&&D.goals.find(q=>q.id===id);gico=x?x.icon:ICONS[0];const qi=esc(id||'');

day:d=>{selDay=d.d;render()},
da:d=>{const c=D.cats.find(c=>c.id===d.i);if(c)mut(()=>{c.amts=amtsOf(c).filter(x=>x!==+d.v)})},
aa:d=>{const c=D.cats.find(c=>c.id===d.i),v=Math.round(+g('na-'+d.i).value);if(!c)return;if(!(v>0&&v<=1e8)){toast('金額を入れてください');return}
  const a=[...new Set([...amtsOf(c),v])].sort((x,y)=>x-y);if(a.length>12){toast('ボタンは12個までです');return}mut(()=>{c.amts=a})},
rc:d=>{if(!confirm('このカテゴリーを削除しますか？（記録は残ります）'))return;mut(()=>{D.cats=D.cats.filter(c=>c.id!==d.i);if(sel===d.i)sel=D.cats[0]&&D.cats[0].id},'カテゴリーを削除しました',1)},
ac:openAddCat,
pc:d=>{const e=g('nc-n');if(!e)return;e.value=d.n;g('cand').innerHTML=candHtml('',d.n)},
acs:()=>{const n=g('nc-n').value.trim().slice(0,30),b=Math.min(1e9,Math.max(0,Math.round(+g('nc-b').value||0)));
  if(!n){toast('カテゴリー名を入力してください');return}
  if(D.cats.some(c=>c.name===n)){toast('同じ名前のカテゴリーがあります');return}
  if(D.cats.length>=200){toast('カテゴリーは200個までです');return}
  const id=uid();closeSheet();mut(()=>{D.cats.push({id,name:n,budget:b});if(!sel)sel=id},'カテゴリーを追加しました',1)},
srch:()=>{sq=sqDef();tab='search';scrollTo(0,0);render();const e=g('sq-q');if(e)e.focus()},
sc:d=>{sq.cat=d.i||'';render()},
sp:d=>{if(!['all','this','last','custom'].includes(d.k))return;sq.p=d.k;render()},
sclr:()=>{sq=sqDef();render()},
gnew:()=>gform(null),gedit:d=>gform(d.i),gopen:d=>openGoal(d.i),aedit:d=>openAlloc(d.i),
gico:d=>{gico=d.v;document.querySelectorAll('.ico').forEach(b=>b.classList.toggle('on',b.dataset.v===gico))},
gfill:d=>{g('ga').value=Math.min(+d.v,avail(mk(vm)))||''},
gsave:d=>{const n=g('g-n').value.trim().slice(0,20),t=Math.round(+g('g-t').value);
  if(!n){toast('目標の名前を入れてください');return}
  if(!(t>=1&&t<=1e9)){toast('目標金額を入れてください');return}
  const x=d.i&&D.goals.find(q=>q.id===d.i);closeSheet();
  if(x)mut(()=>Object.assign(x,{name:n,icon:gico,target:t}),'目標を更新しました',1);
  else mut(()=>{D.goals.push({id:uid(),name:n,icon:gico,target:t})},'目標を追加しました',1)},
gdel:d=>{if(!confirm('この目標を削除しますか？\n振り分けた金額は、その月の残額に戻ります。'))return;closeSheet();mut(()=>{D.goals=D.goals.filter(q=>q.id!==d.i);D.allocs=D.allocs.filter(a=>a.goal!==d.i)},'目標を削除しました',1)},
galloc:d=>{const x=D.goals.find(q=>q.id===d.i);if(!x)return;const m=mk(vm),a=Math.round(+g('ga').value),av=avail(m);
  if(!(a>=1)){toast('金額を入れてください');return}
  if(a>av){toast('振り分けできる残額は '+yen(av)+' までです');return}
  const was=gsum(x.id)>=x.target;closeSheet();
  mut(()=>{D.allocs.push({id:uid(),goal:x.id,month:m,date:ds(new Date()),amt:a})},yen(a)+' を振り分けました',1);
  if(!was&&gsum(x.id)>=x.target)celebrate(x)},
asave:d=>{const a=D.allocs.find(q=>q.id===d.i);if(!a)return;const v=Math.round(+g('al-a').value),mx=avail(a.month)+a.amt;
  if(!(v>=1)){toast('金額を入れてください');return}
  if(v>mx){toast('上限は '+yen(mx)+' です');return}
  const x=D.goals.find(q=>q.id===a.goal),was=x&&gsum(x.id)>=x.target;closeSheet();
  mut(()=>{a.amt=v},'振り分けを修正しました',1);if(x&&!was&&gsum(x.id)>=x.target)celebrate(x)},
adel:d=>{closeSheet();mut(()=>{D.allocs=D.allocs.filter(q=>q.id!==d.i)},'振り分けを取り消しました',1)},
setcat:d=>{const i=st.cats.indexOf(d.n);if(i>=0)st.cats.splice(i,1);else st.cats.push(d.n);updSetup()},
setmax:d=>{st.max=+d.v;g('sx-in').value=d.v;updSetup()},
setdone:()=>sfinish(false),setskip:()=>sfinish(true),
resetup:()=>showSetup(true),
texit:()=>{try{const u=new URL(location.href);u.searchParams.delete('test');u.hash='';history.replaceState(null,'',u.toString())}catch(e){}location.reload()},
amx:d=>setAmax(+d.v),amxs:()=>setAmax(Math.round(+g('amx').value)),
ra:d=>{const c=D.cats.find(c=>c.id===d.i);if(c)mut(()=>{delete c.amts},'自動の金額ボタンに戻しました')},
exp:async()=>{const txt=JSON.stringify({app:'daitai-chokin',...D,exported:new Date().toISOString()},null,1),fn='daitai-chokin-'+ds(new Date()).replace(/-/g,'')+'.json';
  try{const dl=window.claude&&await claude.use('downloads');
    if(dl){await dl.save({filename:fn,data:txt});toast('バックアップを書き出しました');return}}
  catch(e){if(!(e&&e.code==='declined'))toast('書き出せませんでした');return}
  const b=new Blob([txt],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('バックアップを書き出しました')},
imp:()=>g('fi').click(),
impt:()=>doImport(g('im').value),
cp:()=>{const s=JSON.stringify(D);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('コピーしました'),()=>{g('im').value=s;g('im').select();toast('文字列を表示しました。コピーしてください')})}
};
const C={
memo:(d,v)=>{const i=D.items.find(x=>x.id===d.i);if(i){snap();i.memo=v.trim().slice(0,60);save();toast('メモを保存しました')}},
ren:(d,v)=>{const c=D.cats.find(c=>c.id===d.i);if(c&&v.trim())mut(()=>{c.name=v.trim().slice(0,30)})},
cb:(d,v)=>{const c=D.cats.find(c=>c.id===d.i);if(c)mut(()=>{c.budget=Math.min(1e9,Math.max(0,Math.round(+v||0)))})},
mb:(d,v)=>mut(()=>{D.mb[d.m]=Math.min(1e9,Math.max(0,Math.round(+v||0)))},'予算を更新しました')
};
document.addEventListener('click',e=>{if(e.target.id==='sh'){closeSheet();return}const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset,t)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.c&&C[t.dataset.c])C[t.dataset.c](t.dataset,t.value)});
document.addEventListener('input',e=>{const t=e.target,id=t.id||'';
  if(id==='mn'){const v=parseInt(t.value);g('mpv').textContent=v>0?'= '+yen(v*10):'12と入れると ¥120'}
  else if(id==='sx-in'){st.max=Math.round(+t.value);updSetup()}
  else if(id==='amx'){const v=Math.round(+t.value);g('amp').textContent=amaxOk(v)?'ボタン: '+genAmts(v).map(n=>n.toLocaleString()).join(' / '):'100〜10,000,000円で入力してください'}
  else if(id==='nc-n'){const c=g('cand');if(c)c.innerHTML=candHtml(t.value,t.value.trim())}
  else if(id.startsWith('sq-')){const k={'sq-q':'q','sq-min':'min','sq-max':'max','sq-f':'from','sq-t':'to'}[id];if(k){sq[k]=t.value;const r=g('sr');if(r)r.innerHTML=srRes()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
g('fi').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>8e6){toast('ファイルが大きすぎます');return}
  const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>toast('ファイルを読み込めませんでした');r.readAsText(f)});
applySkin();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applySkin);
const SETUP=NEWU&&pref('daitai-setup',v=>v==='1','')!=='1';
if(NEWU&&!SETUP){D=def();sel=D.cats[0].id}  // 設定済みなのにデータが無い異常時の保険
render();
if(SETUP)showSetup(false);
else if(pref('daitai-tour',v=>v==='1','')!=='1'){setPref('daitai-tour','1');showTour(0)}
</script></body></html>
